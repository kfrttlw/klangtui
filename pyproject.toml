[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "klangtui"
version = "0.1.0"
description = "SoundCloud player in your terminal — search, play, like, playlists"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "kfrt" }]
dependencies = [
    "rich",
    "textual",
    "playwright",
]

[project.urls]
Homepage = "https://github.com/kfrttlw/klangtui"

[project.scripts]
klangtui = "klangtui.klangtui:main"

[tool.setuptools]
packages = ["klangtui"]

[tool.ruff]
# Same deal as veltui: PEP 8 allows a 99-column limit for teams that agree on
# it, and klangtui's aligned tables (commands, themes) read better unwrapped.
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W"]
